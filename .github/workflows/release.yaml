name: release

on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to backfill'
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  release-please:
    if: "${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}"
    permissions:
      contents: write  # for google-github-actions/release-please-action to create release commit
      pull-requests: write  # for google-github-actions/release-please-action to create release PR
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    # Release-please creates a PR that tracks all changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{secrets.GITHUB_TOKEN}}

  release-target:
    needs: release-please
    if: "${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true' || startsWith(github.event.head_commit.message, 'chore(main): release')) }}"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      backfill: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --force origin main:refs/remotes/origin/main
          if [ -n "$REQUESTED_TAG" ]; then
            if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag" >&2
              exit 1
            fi
            if ! git show-ref --verify --quiet "refs/tags/$REQUESTED_TAG"; then
              echo "Release tag not found" >&2
              exit 1
            fi
            tag_commit="$(git rev-parse "$REQUESTED_TAG^{commit}")"
            if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
              echo "Release tag is not on main" >&2
              exit 1
            fi
            if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${REQUESTED_TAG}" >/dev/null; then
              echo "GitHub release not found" >&2
              exit 1
            fi
            tag="$REQUESTED_TAG"
          else
            git fetch --force --tags origin
            if [ -n "$RELEASE_TAG" ]; then
              if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
                echo "Release tag not found" >&2
                exit 1
              fi
              tag="$RELEASE_TAG"
            else
              tags="$(git tag --points-at "$GITHUB_SHA" --sort=-version:refname)"
              tag="${tags%%$'\n'*}"
            fi
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  goreleaser:
    if: ${{ needs.release-target.outputs.tag != '' }}
    permissions:
      contents: write
    needs:
      - release-target
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: false
          dotnet: false
          haskell: false
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-target.outputs.tag }}
          fetch-depth: 0
      - name: Use current GoReleaser configuration for backfill
        if: ${{ needs.release-target.outputs.backfill == 'true' }}
        run: |
          set -euo pipefail
          git fetch --force origin main:refs/remotes/origin/main
          git show origin/main:.goreleaser.yaml > .goreleaser.yaml
          if grep -q '^release:' .goreleaser.yaml; then
            echo "unexpected release section in GoReleaser configuration" >&2
            exit 1
          fi
          printf '\nrelease:\n  replace_existing_artifacts: true\n' >> .goreleaser.yaml
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '~1.26'
      - name: Download Syft
        uses: anchore/sbom-action/download-syft@55dc4ee22412511ee8c3142cbea40418e6cec693 # v0.17.8
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          version: latest
          args: release --clean ${{ needs.release-target.outputs.backfill == 'true' && '--skip=announce,homebrew,before' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.K8SGPT_BOT_SECRET }}
#      - name: Update new version in krew-index
#        uses: rajatjindal/krew-release-bot@3d9faef30a82761d610544f62afddca00993eef9 # v0.0.47

  build-container:
    if: ${{ needs.release-target.outputs.tag != '' && needs.release-target.outputs.backfill != 'true' }}
    needs:
      - release-target
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      IMAGE_TAG: ghcr.io/k8sgpt-ai/k8sgpt:${{ needs.release-target.outputs.tag }}
      IMAGE_NAME: k8sgpt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          ref: ${{ needs.release-target.outputs.tag }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.K8SGPT_BOT_SECRET }}

      - name: Build Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./container/Dockerfile
          platforms: linux/amd64,linux/arm64
          target: production
          tags: |
            ${{ env.IMAGE_TAG }}
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ env.IMAGE_TAG }}
          cache-to: type=gha,scope=${{ github.ref_name }}-${{ env.IMAGE_TAG }}

      - name: Generate SBOM
        uses: anchore/sbom-action@55dc4ee22412511ee8c3142cbea40418e6cec693 # v0.17.8
        with:
          image: ${{ env.IMAGE_TAG }}
          artifact-name: sbom-${{ env.IMAGE_NAME }}
          output-file: ./sbom-${{ env.IMAGE_NAME }}.spdx.json

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.release-target.outputs.tag }}
          files: ./sbom-${{ env.IMAGE_NAME }}.spdx.json
